$schema: "https://json-schema.org/draft/2020-12/schema"
title: Block
description: Specification of an architectural block
type: object
required: [ type, metadata, spec ]
additionalProperties: false
properties:
  type:
    type: string
    enum: [ component, connector, toplevel ]
  metadata:
    type: object
    required: [ name ]
    properties:
      name:
        type: string
  spec:
    type: object
    required: [ body ]
    additionalProperties: false
    properties:
      configSchema:
        description: The schema for the block's configuration, including default values.
        $ref: "https://json-schema.org/draft/2020-12/schema"
      interfaces:
        description: The list of the block's interfaces
        type: object
        additionalProperties:
          type: object
          required: [ role ]
          properties:
            role:
              type: string
            polarity:
              type: string
              enum: [ north, south ]
            configSchema:
              description: The schema for the interface's configuration, including default values.
              $ref: "https://json-schema.org/draft/2020-12/schema"
      body:
        type: object
        oneOf:
          - required: [ simple ]
          - required: [ composite ]
        additionalProperties: false
        properties:
          simple:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                affinity:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                template:
                  type: string
          composite:
            type: object
            additionalProperties:
              type: object
              required: [ block ]
              additionalProperties: false
              properties:
                block:
                  type: string
                  description: The identifier of the instantiated block
                config:
                  type: object
                  description: Instance of the block's configuration schema
                labels:
                  type: object
                bindings:
                  type: object
                  additionalProperties:
                    description: The binding key is the name of an interface on the instantiated block
                    type: object
                    oneOf:
                      - required: [ block, interface ]
                      - required: [ super ]
                    additionalProperties: false
                    properties:
                      block:
                        type: string
                        description: The name of the block in this composite
                      interface:
                        type: string
                        description: The name of an interface on the specified block
                      super:
                        type: string
                        description: The name of an interface of this composite block
