type: connector
metadata:
  name: std/tcp-connector
  annotations:
    platform: skupper
spec:
  configSchema:
    type: object
    properties:
      keyPrefix:
        type: string
        description: "Prefix annotation for the generated routing keys"
        default: tcp
      distribution:
        type: string
        enum: [ balanced, closest ]
        description: "Distribution algorithm used in the network for service traffic"
        default: balanced
      priority:
        type: string
        enum: [ lowest, "1", "2", "3", normal, "5", "6", "7", "8", "9", highest ]
        description: "Priority used to forward service traffic through the network"
        default: normal
      protocol:
        type: string
        description: "Application protocol that runs over the transport"
        default: none
      connectorType:
        type: string
        enum: [ host, selector ]
        description: "How the connector locates target processes"
        default: selector
      networkPolicyOnAcceptor:
        type: boolean
        description: "Generate network policy to match the acceptor"
        default: false
      networkPolicyOnConnector:
        type: boolean
        description: "Generate network policy to match the connector"
        default: false
      vanFlowTransport:
        type: boolean
        description: "Generate vanFlow transport events"
        default: false
      vanFlowProtocol:
        type: boolean
        description: "Generate vanFlow protocol events"
        default: false
      requiredAverageRate:
        type: number
        description: Expected average bandwidth usage
      requiredPeakRate:
        type: number
        description: Expected peak bandwidth usage
      requiredLatency:
        type: number
        description: Minimum expected network latency
  interfaces:
    acceptor:
      role: accept
    connector:
      role: connect
  body:
  - name: acceptor.yaml
    affinity: [ acceptor ]
    description: "Interface to Skupper-v2 acceptors on kubernetes sites"
    template: |
      ---
      apiVersion: skupper.io/v2alpha1
      kind: Connector
      metadata:
        name: connector-{{.ident}}
      spec:
        type: tcp
        selector: {{$affblock.selectorKey}}={{$affblock.selectorValue}}
        port: {{$affif.port}}
        routingKey: {{.keyPrefix}}{{.name}}
      {{- if .networkPolicyOnAcceptor}}
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ingress-policy-{{.ident}}
      spec:
        podSelector:
          matchLabels:
            {{$affblock.selectorKey}} : {{$affblock.selectorValue}}
        policyTypes:
        - Ingress
        ingress:
        - from:
          - podSelector:
              matchLabels:
                skupper.io/component: router
          ports:
          - protocol: TCP
            port: {{$affif.port}}
      {{-end}}
  - name: connector.yaml
    affinity: [ connector ]
    description: "Interface to Skupper-v2 connectors on kubernetes sites"
    template: |
      ---
      apiVersion: skupper.io/v2alpha1
      kind: Listener
      metadata:
        name: listener-{{.ident}}
      spec:
        type: tcp
        host: {{$affif.host}}
        port: {{$affif.port}}
        routingKey: {{.keyPrefix}}{{.name}}
      {{- if .networkPolicyOnConnector}}
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: egress-policy-{{.ident}}
      spec:
        podSelector:
          matchLabels:
            {{$affblock.selectorKey}} : {{$affblock.selectorValue}}
        policyTypes:
        - Egress
        egress:
        - to:
          - podSelector:
              matchLabels:
                skupper.io/component: router
          ports:
          - protocol: TCP
            port: {{$affif.port}}
      {{-end}}
